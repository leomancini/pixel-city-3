<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<!-- Added to the Home Screen, the game runs full screen with the backdrop
     behind the status bar and no address bar. -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pixel City 3">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" href="/apple-touch-icon.png">
<title>Pixel City 3</title>
<style>
  :root {
    --radius: 22px; --gap: 20px; --stack-gap: 30px; --card-pad: 30px; --screen-radius: calc(var(--radius) - 3px); --bezel: 0px;
    /* Text metrics. The font is pixel-exact at multiples of 10px. */
    --text: 20px; --line: 27px; --go-text: 30px;
    --option-pad: 4px; --indent: 24px;
    --cursor-w: 8px; --cursor-h: 14px; --cursor-top: 11px;
    /* Leading above the first line's capitals / below the last option's
       baseline, plus the 8px the card's border and inner line take. */
    --ink-top: 15px; --ink-bottom: 18px;
  }
  /* Desktop Retina: 15px is 1.5 CSS px per font pixel, which is exactly
     3 device pixels at 2x, so it stays crisp there. */
  @media (hover: hover) and (pointer: fine) and (min-resolution: 2dppx) {
    :root {
      --card-pad: 24px;
      --text: 15px; --line: 21px; --go-text: 20px;
      --option-pad: 3px; --indent: 18px;
      --cursor-w: 6px; --cursor-h: 10.5px; --cursor-top: 8.5px;
      --ink-top: 14px; --ink-bottom: 16px;
    }
  }
  @font-face {
    font-family: "Analog Mono Plus";
    src: url("/fonts/AnalogMonoPlus.ttf") format("truetype");
    font-display: block;
  }
  * {
    box-sizing: border-box;
    /* It is a game, not a document: no double-tap zoom, no text selection,
       no long-press callout. Panning (scrolling the card) still works. */
    touch-action: manipulation;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
  }
  html { background: #0a0a0a; overscroll-behavior: none; }
  body {
    margin: 0;
    height: 100dvh;
    overflow: hidden;
    /* No background here: the page colour is on html. */
    color: #000;
    font-family: "Analog Mono Plus", ui-monospace, Menlo, monospace;
    /* Pixel font, set like ai-pixel-art-frame: uppercase, no smoothing. Its
       glyphs are drawn on a 10-per-em grid, so only multiples of 10px are
       pixel-exact: 20px = 2px per font pixel, 30px = 3px. */
    text-transform: uppercase;
    -webkit-font-smoothing: none;
    font-smooth: never;
    text-rendering: optimizeSpeed;
    display: flex;
    justify-content: center;
    /* Keep the game clear of the notch and home indicator. */
    padding: max(var(--gap), env(safe-area-inset-top)) max(var(--gap), env(safe-area-inset-right))
      max(var(--gap), env(safe-area-inset-bottom)) max(var(--gap), env(safe-area-inset-left));
    overscroll-behavior: none;
  }
  main { width: 100%; max-width: min(350px, 40dvh); height: 100%; display: flex; flex-direction: column; gap: var(--stack-gap); }

  .frame {
    position: relative;
    flex: none;
    aspect-ratio: 1;
    /* No black edge: the picture runs the full width of the column, the same
       as the text card, with only a 3px white line overlay-blended into it. */
    border-radius: var(--radius);
    overflow: hidden;
    padding: var(--bezel);
  }
  .frame::before {
    content: "";
    position: absolute;
    inset: 0;
    border: 3px solid #fff;
    mix-blend-mode: overlay;
    border-radius: var(--radius);
    pointer-events: none;
    z-index: 2;
  }
  canvas {
    width: 100%;
    height: 100%;
    display: block;
    image-rendering: pixelated;
    border-radius: var(--radius);
    background: #0d1330;
    transition: opacity 0.2s;
  }
  /* While loading, the previous picture is hidden entirely: the whole screen,
     rim included, is the shimmer's dark blue. */
  .frame.loading { background: #0a0e28; }
  .frame.loading #canvas { opacity: 0; }
  /* Halftone shimmer sweeping across the picture while the next level
     loads; drawn from script (drawShimmer) in the backdrop's dot style. */
  #shimmer {
    display: none;
    position: absolute;
    /* Inside the 3px rim line, not over it. */
    top: 3px;
    left: 3px;
    width: calc(100% - 6px);
    height: calc(100% - 6px);
    border-radius: calc(var(--radius) - 3px);
    opacity: 1;
  }
  .frame.loading #shimmer { display: block; }

  .dialog {
    position: relative;
    flex: 1;
    min-height: 0;
    display: flex;
    padding: 5px;
    background: #fff;
    border: 3px solid #000;
    border-radius: var(--radius);
  }
  .dialog::before {
    content: "";
    position: absolute;
    inset: 3px;
    border: 2px solid #000;
    border-radius: calc(var(--radius) - 6px);
    pointer-events: none;
  }
  /* The only scrolling region on the page. */
  .dialog-scroll {
    flex: 1;
    overflow-y: auto;
    overscroll-behavior: contain;
    border-radius: calc(var(--radius) - 8px);
    /* Optical padding: the glyph ink (not the line box) sits --card-pad from
       the card's outer edge on every side. */
    padding: calc(var(--card-pad) - var(--ink-top)) calc(var(--card-pad) - 8px) calc(var(--card-pad) - var(--ink-bottom));
  }
  #scene {
    margin: 0;
    font-size: var(--text);
    line-height: var(--line);
    overflow-wrap: break-word;
  }
  /* Loading ellipsis: one dot, two, three, repeat. Monospace, so 1ch = one dot. */
  .blink::after {
    content: "...";
    display: inline-block;
    white-space: nowrap;
    overflow: hidden;
    vertical-align: bottom;
    width: 1ch;
    animation: dots 1.2s steps(1) infinite;
  }
  @keyframes dots { 0% { width: 1ch; } 33% { width: 2ch; } 66% { width: 3ch; } }

  #options { list-style: none; margin: 16px 0 0; padding: 0; }
  #options:empty { display: none; }
  #options li {
    position: relative;
    padding: var(--option-pad) 0 var(--option-pad) var(--indent);
    font-size: var(--text);
    line-height: var(--line);
    text-transform: uppercase;
    /* Only the option the cursor is on is black. */
    color: #9a9a9a;
  }
  #options li.selected { color: #000; }
  #options li.selected::before {
    content: "";
    position: absolute;
    left: 0;
    top: var(--cursor-top);
    width: var(--cursor-w);
    height: var(--cursor-h);
    background: #000;
    clip-path: polygon(0 0, 25% 0, 25% 14%, 50% 14%, 50% 28%, 75% 28%, 75% 43%, 100% 43%, 100% 57%, 75% 57%, 75% 72%, 50% 72%, 50% 86%, 25% 86%, 25% 100%, 0 100%);
  }

  /* One row: up, Go, down. */
  .pad { flex: none; display: grid; grid-template-columns: 1fr 1.3fr 1fr; gap: var(--gap); }
  #up { order: 1; }
  #down { order: 3; }
  .pad button {
    height: 47px;
    margin-bottom: 7px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #3d3d3d;
    border-radius: 10px;
    box-shadow: 0 7px 0 #1c1c1c;
    border: 0;
    padding: 0;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .pad button.pressed, .pad button:active { transform: translateY(5px); box-shadow: 0 2px 0 #1c1c1c; }
  #go.pressed, #go:active { box-shadow: 0 2px 0 #2e2e2e; }
  .pad button:focus { outline: none; }
  #go {
    order: 2;
    background: #666;
    box-shadow: 0 7px 0 #2e2e2e;
    color: #fff;
    font: inherit;
    font-size: var(--go-text);
    line-height: 1;
    text-transform: uppercase;
    -webkit-font-smoothing: none;
  }
  .pad svg { display: block; fill: #fff; shape-rendering: crispEdges; }

  /* Phones: use the full width. The text card keeps a usable height and the
     picture frame gives up height (cropping the picture top and bottom) when
     the screen is too short for a full square. */
  @media (max-width: 600px) {
    :root { --card-pad: 24px; }
    /* Sit close to the top and bottom edges of the visible area. */
    body {
      padding-top: max(20px, env(safe-area-inset-top));
      padding-bottom: max(24px, env(safe-area-inset-bottom));
    }
    /* The screen is always as wide as the column (and the text card). It is
       square when there is room; on a short screen it gives up height and the
       picture is cropped top and bottom, leaving the card its minimum. */
    main { max-width: none; }
    /* --frame-size is measured in script (fitFrame): the column width, or
       less on a short screen. */
    .frame {
      flex: none;
      aspect-ratio: auto;
      width: 100%;
      height: var(--frame-size, auto);
    }
    /* The card takes what is left and scrolls inside if that is tight. */
    .dialog { flex: 1 1 0; min-height: 0; }
  }

  /* Opened from the Home Screen (full screen); the class is set from script.
     --screen-h is the physical screen height: on iOS the full-screen viewport
     comes up short by about the status bar's height, leaving a gap below. */
  html.standalone, html.standalone body { height: var(--screen-h, 100vh); }
  html.standalone body {
    /* Extra room at the top keeps the frame clear of the soft blur iOS draws
       under the status bar; sit closer to the bottom than the full
       home-indicator safe area. */
    padding-top: calc(env(safe-area-inset-top) + 30px);
    padding-bottom: calc(env(safe-area-inset-bottom) + 30px);
  }

  @media (prefers-reduced-motion: reduce) {
    .blink::after { animation: none; width: 3ch; }
    canvas { transition: none; }
  }
</style>
</head>
<body>
<main>
  <div class="frame loading" id="frame">
    <canvas id="canvas" width="256" height="256" aria-label="Scene illustration"></canvas>
    <canvas id="shimmer" aria-hidden="true"></canvas>
  </div>
  <section class="dialog" aria-live="polite">
    <div class="dialog-scroll" id="scroll">
      <p id="scene"></p>
      <ul id="options"></ul>
    </div>
  </section>
  <div class="pad">
    <button id="up" type="button" tabindex="-1" aria-label="Previous option">
      <svg width="25" height="12" viewBox="0 0 25 12" aria-hidden="true">
        <rect x="9" y="0" width="7" height="3"/><rect x="6" y="3" width="13" height="3"/>
        <rect x="3" y="6" width="19" height="3"/><rect x="0" y="9" width="25" height="3"/>
      </svg>
    </button>
    <button id="down" type="button" tabindex="-1" aria-label="Next option">
      <svg width="25" height="12" viewBox="0 0 25 12" aria-hidden="true">
        <rect x="0" y="0" width="25" height="3"/><rect x="3" y="3" width="19" height="3"/>
        <rect x="6" y="6" width="13" height="3"/><rect x="9" y="9" width="7" height="3"/>
      </svg>
    </button>
    <button id="go" type="button" tabindex="-1">Go</button>
  </div>
</main>
<script>
  // Full-screen (Home Screen) mode: flag it and tell CSS the real screen height.
  // (iOS reports navigator.standalone but does not match the display-mode
  // media query, so the check has to be done here rather than in CSS.)
  const standalone = navigator.standalone === true ||
    matchMedia("(display-mode: standalone), (display-mode: fullscreen)").matches;
  function setScreenHeight() {
    const portrait = matchMedia("(orientation: portrait)").matches;
    const h = portrait ? Math.max(screen.width, screen.height) : Math.min(screen.width, screen.height);
    document.documentElement.style.setProperty("--screen-h", h + "px");
  }
  if (standalone) {
    document.documentElement.classList.add("standalone");
    setScreenHeight();
    addEventListener("resize", setScreenHeight);
  }

  // Loading shimmer: a diagonal band of light crossing the screen, rendered as
  // halftone squares on the same grid as the backdrop and stepped in time so
  // it moves like pixel art rather than a smooth gradient.
  const shimmer = document.getElementById("shimmer");
  const shimmerCtx = shimmer.getContext("2d");
  const SHIMMER_PERIOD = 1800;  // ms per sweep
  const SHIMMER_STEP = 60;      // ms per animation step
  const stillShimmer = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let shimmerStep = -1;
  function drawShimmer(now) {
    requestAnimationFrame(drawShimmer);
    if (!frameEl.classList.contains("loading")) { shimmerStep = -1; return; }
    const step = stillShimmer ? 0 : Math.floor(now / SHIMMER_STEP);
    const dpr = Math.round(devicePixelRatio) || 1;
    const w = Math.round(shimmer.clientWidth * dpr);
    const h = Math.round(shimmer.clientHeight * dpr);
    if (step === shimmerStep && shimmer.width === w && shimmer.height === h) return;
    shimmerStep = step;
    shimmer.width = w;
    shimmer.height = h;
    const cell = HALFTONE_CELL * dpr;
    const cols = Math.ceil(w / cell);
    const rows = Math.ceil(h / cell);
    shimmerCtx.fillStyle = "rgba(10, 14, 40, 0.6)";
    shimmerCtx.fillRect(0, 0, w, h);
    shimmerCtx.fillStyle = "rgb(48, 78, 180)";
    const slant = 0.3;                 // band leans like the old 105deg gradient
    const band = cols * 0.45;          // half-width of the band, in cells
    const span = cols + rows * slant + band * 2;
    const phase = ((step * SHIMMER_STEP) % SHIMMER_PERIOD) / SHIMMER_PERIOD;
    const centre = phase * span - band;
    for (let y = 0; y < rows; y++) {
      for (let x = 0; x < cols; x++) {
        const d = Math.abs(x + (rows - y) * slant - centre) / band;
        const level = stillShimmer ? 0.25 : Math.max(0, 1 - d) ** 1.5;
        const size = Math.round(cell * Math.min(1, 0.2 + level * 0.8));
        const off = (cell - size) >> 1;
        shimmerCtx.fillRect(x * cell + off, y * cell + off, size, size);
      }
    }
  }
  requestAnimationFrame(drawShimmer);

  // Phone layout: the screen is the column's width, and as tall as that (square)
  // unless the height left over once the card has a bare minimum and the
  // buttons theirs is less; then the picture is cropped top and bottom.
  const CARD_MIN = 190;
  function fitFrame() {
    const main = document.querySelector("main");
    const gap = parseFloat(getComputedStyle(main).rowGap) || 20;
    const padH = document.querySelector(".pad").offsetHeight;
    const size = Math.floor(Math.min(main.clientWidth, main.clientHeight - CARD_MIN - padH - 2 * gap));
    document.documentElement.style.setProperty("--frame-size", Math.max(80, size) + "px");
  }
  fitFrame();
  addEventListener("resize", fitFrame);
  document.fonts?.ready.then(fitFrame);

  // Phone text: start at the font's native 20px and, only if the card's text
  // does not fit, step down to the next size that still lands every font pixel
  // on whole device pixels (the font is drawn on a 10-per-em grid, so that is
  // any size where size * devicePixelRatio / 10 is a whole number).
  const TEXT_VARS = { "--text": 20, "--line": 27, "--option-pad": 4, "--indent": 24, "--cursor-w": 8, "--cursor-h": 14, "--cursor-top": 11, "--ink-top": 15, "--ink-bottom": 18 };
  const TEXT_MIN = 13;
  const phone = matchMedia("(max-width: 600px)");
  const scrollBox = document.getElementById("scroll");
  function setTextSize(px) {
    const root = document.documentElement.style;
    const dpr = devicePixelRatio || 1;
    for (const [name, at20] of Object.entries(TEXT_VARS)) {
      if (px === null) root.removeProperty(name);
      else root.setProperty(name, (name === "--text" ? px : Math.round(at20 * px / 20 * dpr) / dpr) + "px");
    }
  }
  function fitText() {
    if (!phone.matches) return setTextSize(null);
    const dpr = devicePixelRatio || 1;
    let k = Math.max(1, Math.round(20 * dpr / 10));   // device px per font pixel
    setTextSize(k * 10 / dpr);
    while (scrollBox.scrollHeight > scrollBox.clientHeight + 1 && (k - 1) * 10 / dpr >= TEXT_MIN) {
      k -= 1;
      setTextSize(k * 10 / dpr);
    }
  }
  new MutationObserver(fitText).observe(scrollBox, { childList: true, subtree: true, characterData: true });
  new ResizeObserver(fitText).observe(scrollBox);
  document.fonts?.ready.then(fitText);

  // Layout diagnostics for phone debugging: posts the page's measurements to
  // the server log, only when the page is served from a local address.
  const localHost = /^(localhost|127\.\d+\.\d+\.\d+|\[::1\]|10\.\d+\.\d+\.\d+|192\.168\.\d+\.\d+|172\.(1[6-9]|2\d|3[01])\.\d+\.\d+|[a-z0-9-]+\.local)$/i.test(location.hostname);
  if (localHost) setTimeout(() => {
    const probe = document.createElement("div");
    probe.style.cssText = "position:fixed;visibility:hidden;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)";
    document.body.append(probe);
    const ps = getComputedStyle(probe);
    const rect = (el) => { const r = el.getBoundingClientRect(); return [r.top, r.bottom, r.height, r.width].map(Math.round); };
    const bs = getComputedStyle(document.body);
    fetch("/api/debug", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({
      standalone, navStandalone: navigator.standalone, dmStandalone: matchMedia("(display-mode: standalone)").matches,
      htmlClass: document.documentElement.className, inner: [innerWidth, innerHeight], screen: [screen.width, screen.height],
      client: [document.documentElement.clientWidth, document.documentElement.clientHeight],
      visual: visualViewport ? [Math.round(visualViewport.width), Math.round(visualViewport.height)] : null,
      dpr: devicePixelRatio, safe: [ps.paddingTop, ps.paddingRight, ps.paddingBottom, ps.paddingLeft],
      html: rect(document.documentElement), body: rect(document.body), bodyPad: [bs.paddingTop, bs.paddingBottom],
      frame: rect(document.getElementById("frame")), canvas: rect(document.getElementById("canvas")), dialog: rect(document.querySelector(".dialog")), frameSize: getComputedStyle(document.documentElement).getPropertyValue("--frame-size"), text: getComputedStyle(document.documentElement).getPropertyValue("--text"), cardOverflow: document.getElementById("scroll").scrollHeight - document.getElementById("scroll").clientHeight, pad: rect(document.querySelector(".pad")), go: rect(document.getElementById("go")),
      ua: navigator.userAgent.slice(0, 120),
    }) }).catch(() => {});
    probe.remove();
  }, 800);

  const SEED = "Start an adventure by arriving in a new city you have never seen before.";
  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d");
  const frameEl = document.getElementById("frame");
  const sceneEl = document.getElementById("scene");
  const optionsEl = document.getElementById("options");

  const history = [];
  let level = 0;
  let busy = false;
  let selected = 0;

  let actions = [];

  function setScene(text, loading) {
    sceneEl.textContent = text;
    sceneEl.classList.toggle("blink", !!loading);
  }

  function select(index) {
    const all = [...optionsEl.children];
    if (!all.length) return;
    selected = (index + all.length) % all.length;
    all.forEach((li, i) => li.classList.toggle("selected", i === selected));
    all[selected].scrollIntoView({ block: "nearest" });
  }

  function confirm() {
    if (!busy && actions[selected]) actions[selected]();
  }

  // Draw the current picture at the screen's real device-pixel size, so the
  // browser never rescales the canvas (that rescaling is what blurs it).
  let currentImg = null;
  function drawScene() {
    if (!currentImg) return;
    const cw = Math.round(canvas.clientWidth * devicePixelRatio);
    const ch = Math.round(canvas.clientHeight * devicePixelRatio);
    if (!cw || !ch) return;
    if (canvas.width !== cw || canvas.height !== ch) { canvas.width = cw; canvas.height = ch; }
    // Cover: crop the picture, centred, to the screen's shape.
    const { naturalWidth: w, naturalHeight: h } = currentImg;
    const scale = Math.max(cw / w, ch / h);
    const sw = cw / scale, sh = ch / scale;
    // Smooth only when shrinking; when enlarging keep hard pixel edges.
    ctx.imageSmoothingEnabled = scale < 1;
    ctx.imageSmoothingQuality = "high";
    ctx.drawImage(currentImg, (w - sw) / 2, (h - sh) / 2, sw, sh, 0, 0, cw, ch);
  }
  new ResizeObserver(drawScene).observe(canvas);

  // Halftone background: the scene is blurred down to a soft colour field,
  // then each grid cell becomes one square whose size follows its brightness.
  const HALFTONE_CELL = 4;      // CSS px per halftone cell (loading shimmer)

  // Ask the server for the level that follows `prompt`, and decode its image
  // up front so showing it later is instant.
  async function loadLevel(prompt, past, previous, signal) {
    const res = await fetch("/api/level", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ prompt, history: past, previous }),
      signal,
    });
    const data = await res.json();
    if (!res.ok) throw Object.assign(new Error(data.error || "Request failed"), { closed: res.status === 429 });
    const img = new Image();
    img.src = data.image;
    await img.decode();
    return { ...data, img };
  }

  // Start generating the level behind every option now, so choosing one is
  // instant. Each entry remembers whether it has finished.
  // The level on screen: sent with each request for the next one, so the new
  // story and picture carry on from exactly what the player was looking at.
  let current = null;
  let prefetchAbort = null;
  function prefetch(options) {
    prefetchAbort = new AbortController();
    const past = [...history];
    return options.map((text) => {
      const entry = { ready: false };
      entry.promise = loadLevel(text, past, current, prefetchAbort.signal);
      entry.promise.then(() => { entry.ready = true; }, () => {});
      return entry;
    });
  }

  function showOptions(items) {
    optionsEl.innerHTML = "";
    actions = items.map((item) => item.action);
    for (const { label } of items) {
      const li = document.createElement("li");
      li.textContent = label;
      optionsEl.append(li);
    }
    select(0);
    document.getElementById("scroll").scrollTop = 0;
  }

  async function play(prompt, ahead) {
    if (busy) return;
    busy = true;
    const waiting = !ahead?.ready;
    if (waiting) {
      frameEl.classList.add("loading");
      optionsEl.innerHTML = "";
      actions = [];
      setScene(level === 0 ? "Entering the city" : "Level " + (level + 1) + " loading", true);
    }
    try {
      const data = await (ahead ? ahead.promise : loadLevel(prompt, history, current));
      // The paths not taken are no longer needed.
      prefetchAbort?.abort();
      currentImg = data.img;
      drawScene();
      level += 1;
      history.push(`Player chose: ${prompt} Then: ${data.scene}`);
      setScene(data.scene);
      current = { picture: data.picture, options: data.options, image: data.image };
      const next = prefetch(data.options);
      showOptions(data.options.map((text, i) => ({ label: text, action: () => play(text, next[i]) })));
      frameEl.classList.remove("loading");
    } catch (err) {
      setScene(err.closed ? err.message : "Something went wrong: " + err.message);
      showOptions([{ label: "Try again", action: () => play(prompt) }]);
    } finally {
      busy = false;
    }
  }

  // Up/down (keys or the on-screen pads) move the cursor; right arrow, Return
  // or the Go button confirms.
  const padKeys = { ArrowUp: document.getElementById("up"), ArrowDown: document.getElementById("down") };
  const goEl = document.getElementById("go");
  padKeys.ArrowRight = padKeys.Enter = goEl;
  goEl.onclick = () => confirm();

  addEventListener("keydown", (e) => {
    if (e.key === "ArrowUp" || e.key === "ArrowDown") {
      e.preventDefault();
      padKeys[e.key].classList.add("pressed");
      select(selected + (e.key === "ArrowUp" ? -1 : 1));
    } else if ((e.key === "ArrowRight" || e.key === "Enter") && !e.repeat) {
      e.preventDefault();
      goEl.classList.add("pressed");
      confirm();
    }
  });
  padKeys.ArrowUp.onclick = () => select(selected - 1);
  padKeys.ArrowDown.onclick = () => select(selected + 1);
  addEventListener("keyup", (e) => padKeys[e.key]?.classList.remove("pressed"));
  // Touch: iOS Safari does not reliably apply :active to a tapped button, and
  // a quick tap is over before it would show, so drive the pressed look from
  // pointer events and hold it for a moment after the finger lifts.
  const PRESS_MIN_MS = 120;
  document.querySelectorAll(".pad button").forEach((el) => {
    let downAt = 0;
    let timer = 0;
    el.addEventListener("pointerdown", () => {
      clearTimeout(timer);
      downAt = performance.now();
      el.classList.add("pressed");
    });
    const release = () => {
      const wait = Math.max(0, PRESS_MIN_MS - (performance.now() - downAt));
      clearTimeout(timer);
      timer = setTimeout(() => el.classList.remove("pressed"), wait);
    };
    el.addEventListener("pointerup", release);
    el.addEventListener("pointercancel", release);
    el.addEventListener("pointerleave", release);
  });
  addEventListener("blur", () => document.querySelectorAll(".pad button").forEach((el) => el.classList.remove("pressed")));

  play(SEED);
</script>
</body>
</html>
